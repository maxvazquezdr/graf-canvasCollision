<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica 2.5 - Interactividad con Gráficos 2D</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #canvas-container {
        position: relative;
    }
    canvas {
        /* Aquí cargamos tu imagen como fondo ajustada al canvas */
        background-image: url('fondo.jpeg');
        background-size: cover;
        background-position: center;
        display: block;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        border-radius: 6px;
    }
    #contador {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.95);
        padding: 8px 16px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 16px;
        color: #333;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        border: 2px solid #ddd;
    }
</style>
</head>
<body>

<div id="canvas-container">
    <div id="contador">Eliminadas: 0</div>
    <canvas id="canvas" width="900" height="600"></canvas>
</div>

<script src="colision.js"></script>
</body>
</html>
